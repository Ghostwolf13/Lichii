name: Feature Request
description: Feature Request for Lichii's UI
title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post games, keys, firmware, account credentials or unauthorized download links. Use examples and assets you have permission to share.
  - type: textarea
    id: wanted
    attributes:
      label: What do you want ?
      placeholder: "I would like the UI to have..."
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: Why it's useful
      placeholder: "It's useful because it allows..."
    validations:
      required: true
